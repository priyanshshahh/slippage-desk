# Strategy configuration. Every risk number lives here, not in code,
# so the deterministic gates are auditable in one place.

account:
  # Hard expectation for the judging account. Preflight refuses to run if
  # starting equity is materially different from this.
  expected_starting_equity: 100000
  # Trading halts entirely if equity falls below this fraction of the start.
  equity_floor_pct: 0.90

universe:
  # Deep, penny-wide, daily-expiring underlyings. Liquidity is the whole
  # reason for this shortlist: fill quality dominates edge on a 4 day horizon.
  # IWM added for a third independent chain. Its options are thinner, but
  # the quote_width and crossable gates already reject anything untradeable,
  # so the cost of including it is candidates that get refused, not bad fills.
  symbols: [SPY, QQQ, IWM]

entry:
  min_dte: 0
  max_dte: 2
  # Target absolute delta for the SHORT leg.
  #
  # Calibrated against the live SPY chain on 2026-08-31, not from theory.
  # Measured credit/width tracks roughly HALF the short delta on a $5 wide
  # vertical: 0.15 delta paid 0.056, 0.24 delta paid ~0.14. At the old
  # 0.10-0.22 band only 1 of 11 real pairs cleared a 0.10 credit gate, so
  # the agent would have traded almost nothing.
  #
  # 0.24 target pays ~$70/contract against ~$430 defined risk. With a 50%
  # profit take and a 2x stop the breakeven win rate is 67%; a 0.24 delta
  # short leg wins ~75%, so expectancy stays positive with margin.
  short_delta_target: 0.24
  short_delta_min: 0.18
  short_delta_max: 0.30
  # Distance between short and long strike, in dollars.
  spread_width: 5.0
  # Reject the trade unless credit is at least this fraction of the width.
  #
  # Calibration note: for a vertical, credit/width tracks the net probability
  # of finishing ITM, which is roughly (short delta - long delta). At a 0.15
  # short leg that is ~0.06-0.09 in practice. The old 0.15 here demanded
  # about double fair value and blocked 8 of 9 realistic candidates, so the
  # agent would have traded almost nothing. 0.10 still rejects genuinely
  # underpriced credit while remaining reachable at this delta band.
  min_credit_to_width: 0.10
  # Reject if the quoted bid/ask on either leg is wider than this fraction
  # of the mid. Wide markets eat the entire edge on entry plus exit.
  max_rel_spread: 0.35
  # Reject any contract with open interest or volume below these.
  #
  # Enforced in chain.liquid(), but INERT on the free indicative feed, which
  # reports neither field: measured 2026-09-01, 0 of 1054 SPY contracts carried
  # open interest or volume. The gate skips contracts whose feed omits the
  # field rather than emptying the chain, so these thresholds only bite on a
  # paid OPRA subscription. quote_width and crossable carry the liquidity
  # filtering in the meantime, and those work off quotes the feed does supply.
  min_open_interest: 100
  min_volume: 10

risk:
  # Maximum loss on any single spread, as a fraction of current equity.
  max_loss_per_trade_pct: 0.01       # 1% => $1,000 on $100k
  # Total defined risk across all open positions.
  max_portfolio_risk_pct: 0.06       # 6%   => $6,000 on $100k
  # Raised alongside the budget. Expectancy per trade is positive at this
  # delta, so more shots is more expected profit, and the portfolio cap above
  # still bounds total exposure no matter how many fire.
  # Contracts, not spreads. Previously this counted ledger rows, and one row
  # can hold many contracts, so the limit read far stronger than it bound.
  max_concurrent_positions: 16
  # Raised from 8 because the cap, not the risk budget, is what actually
  # stopped the agent: on 2026-08-31 it hit 8/8 while only 21% of the
  # portfolio budget was in use and 230 candidates had cleared every gate.
  max_new_trades_per_day: 16
  # Realized + unrealized loss on the day that halts all new entries.
  daily_loss_limit_pct: 0.02         # 2%   => $2,000 on $100k
  # Never hold more than this many spreads on one underlying.
  max_positions_per_symbol: 8   # contracts per underlying
  # No single underlying may hold more than this share of the portfolio risk
  # budget. Row counts alone let eight contracts land on one strike while the
  # gate still read "2/3 in QQQ".
  max_symbol_risk_share: 0.5

exit:
  # Buy back the spread once this fraction of the credit has decayed.
  #
  # 0.40 rather than the conventional 0.50. A nearer target is hit more often,
  # which over the remaining sessions leaves the median unchanged (+$708 vs
  # +$693 simulated) while lifting the 5th percentile from -$231 to -$154, and
  # frees the capital sooner. Same expected return, less left tail.
  profit_take_pct: 0.40
  # Cut when the spread's debit reaches this multiple of the credit taken in.
  stop_loss_multiple: 2.0
  # Force close any position expiring today at this time, to avoid pin risk
  # and assignment. Times are US/Eastern.
  force_close_time: "15:45"

schedule:
  timezone: America/New_York
  # No new positions opened outside this window.
  entry_start: "10:00"
  entry_stop: "15:30"
  # How often the autonomous loop wakes up, in seconds.
  poll_seconds: 60

llm:
  # The model layer has strictly negative authority: it may VETO a candidate
  # or SHRINK its size. It can never create a trade, widen risk, or overrule
  # a deterministic gate. This is enforced in code, not by prompt.
  enabled: true
  max_size_multiplier: 1.0
  min_size_multiplier: 0.0
  model: claude-opus-5
  # One attempt, no retries. A slow advisor is treated exactly like a broken
  # one: veto, and try again next poll.
  #
  # 90s because the claude CLI pays full agent startup on every call and 20s
  # timed out every time. The loop runs entries at most once per poll and
  # sleeps between polls, so a slower advisor costs cadence, not safety.
  timeout_seconds: 90

execution_quality:
  # The agent scores its own fills and refuses buckets where it has
  # historically surrendered too much of the theoretical credit.
  enabled: true
  # Veto a bucket whose shrunk capture ratio falls below this.
  min_capture_ratio: 0.60
  # Do not veto until the bucket has at least this many scored fills, so
  # the cold start explores rather than locking itself out.
  min_samples_to_veto: 3

reporting:
  # The hackathon reads this account's P&L at a fixed wall-clock moment
  # (2026-09-04 11:00 ET). Force-close only fires on a spread's own expiry
  # day at 15:45, so without this block the submitted number would be a
  # mark-to-market snapshot of an open short-gamma position taken almost
  # five hours before that position actually closes. That is not a P&L, it
  # is a coin flip on Thursday's tape.
  #
  # This is a reporting control, not a risk gate. It stops the agent trading
  # before a cutoff and flattens the book so the reported figure is settled.
  # It is exactly what an operator does before an audit. Both fields are
  # nullable: set either to null to disable that half.
  enabled: true
  # No new entries after this instant. Positions already open keep running
  # under the normal profit-take, stop and force-close rules.
  no_new_entries_after: '2026-09-03T15:45:00-04:00'
  # Close everything still open at this instant, regardless of expiry. Set
  # an hour before the deadline so a failed close has time to retry.
  flatten_all_at: '2026-09-04T10:00:00-04:00'
